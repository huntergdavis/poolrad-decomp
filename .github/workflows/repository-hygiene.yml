name: Repository hygiene

on:
  push:
  pull_request:

jobs:
  checker-builds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install checker import dependencies
        run: python3 -m pip install capstone==5.0.7 unicorn==2.1.4
      - name: Test checker build failure gates
        run: python3 -m unittest discover -s tools/overlay -p 'test_checker_builds.py'
      - name: Flag-semantics census covers every flag-writing helper
        run: python3 -m unittest discover -s tools/overlay -p 'test_flag_census.py'
      - name: Flag helpers in generated sources come from their emitters
        run: python3 -m unittest discover -s tools/overlay -p 'test_emitters_reproduce_sources.py'
      - name: Declared AF-after-shift split allows AF alone, only after a non-zero shift
        run: python3 -m unittest discover -s tools/overlay -p 'test_pinned_shift_flags.py'
      - name: Test candidate pricer input handling
        run: python3 -m unittest discover -s tools/overlay -p 'test_price_candidates.py'
      - name: Compile, load and bind registered row checkers without media
        run: python3 tools/overlay/check_checker_builds.py --all
      - name: Undefined-name gate tests (a hook reading an unbound name fails; bound names pass)
        run: python3 -m unittest discover -s tools/overlay -p 'test_check_checker_names.py'
      - name: Every global name a registered checker reads is bound (compiling is not running)
        run: python3 tools/overlay/check_checker_names.py
  verify-public-tree:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify accounting commit provenance
        run: python3 tools/overlay/check_record_shas.py
      - name: Test accounting provenance guard
        run: python3 -m unittest discover -s tools/overlay -p 'test_record_shas.py'
      - name: Test body/checker pairing gate
        run: python3 -m unittest discover -s tools/overlay -p 'test_check_body_doc_pairing.py'
      # The harness that proves an infeasible-coverage exclusion fails closed. The tests
      # are synthetic (no media): each of the five attacks must catch a sound audit's
      # broken claim and flag an audit that lacks the check it targets.
      - name: Test infeasible-exclusion fail-closed harness
        run: python3 -m unittest discover -s tools/overlay -p 'test_check_exclusion_fail_closed.py'
      # A body or checker must land with its evidence document and CHECKER_ROWS.
      # Needs full history so the merge-base diff resolves.
      - name: Refuse unpaired bodies and checkers
        run: python3 tools/overlay/check_body_doc_pairing.py --base origin/main
      - name: Test declared-boundary credit guard
        run: python3 -m unittest discover -s tools/overlay -p 'test_check_boundary_credits.py'
      # A declared boundary endpoint may be COMPOSED, never credited. This refuses a
      # build where one appears in a credit table, so a hand edit or bad merge fails.
      - name: Refuse declared boundary endpoints in credit tables
        run: python3 tools/overlay/check_boundary_credits.py
      - name: Test credit evidence-kind table
        run: python3 -m unittest discover -s tools/overlay -p 'test_credit_evidence_kind.py'
      # Every strict credit carries one evidence-kind label derived from the tree. A
      # credit, checker or doc change that moves a label must regenerate the table.
      - name: Refuse a stale credit evidence-kind table
        run: python3 tools/overlay/credit_evidence_kind.py --check
      - name: Test evidence-link guard
        run: python3 -m unittest discover -s tools/overlay -p 'test_check_evidence_docs.py'
      # Proves each credited row links to a document that names it. It does NOT
      # prove the mention is substantive: a passing reference passes, so this
      # complements per-row doc-truth review rather than replacing it.
      - name: Verify credited rows link to documents that name them (link resolution only, not substantive review)
        run: python3 tools/overlay/check_evidence_docs.py
      - name: Reject tracked game media and resource files
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '^resources/|(^|/)(\.DS_Store|\._)|\.(DAX|EXE|OVR|SAV|ITM|SPC|ZIP|ADF|D64|PRG|SID)$' -i; then
            echo 'Original game media or resource files must stay outside Git.' >&2
            exit 1
          fi
      - name: Verify copied research snapshot
        run: cd docs/prior-research/macmaps && sha256sum -c SHA256SUMS
      - name: Check oracle preparation script syntax
        run: bash -n tools/oracle/prepare_run.sh tools/oracle/launch.sh
